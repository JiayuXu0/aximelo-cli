name: Publish Aximelo to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0

      - name: Check release tag
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish public package with npm Trusted Publishing
        run: npm publish --access public
