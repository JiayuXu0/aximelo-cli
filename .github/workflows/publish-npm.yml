name: Publish Aximelo to npm

on:
  repository_dispatch:
    types: [manufacturing-ops-release]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.client_payload.commit }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    if: github.event.client_payload.source_repository == 'JiayuXu0/manufacturing-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.client_payload.commit }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Verify approved source and version
        env:
          EXPECTED_COMMIT: ${{ github.event.client_payload.commit }}
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
          SOURCE_LOCK: ${{ github.event.client_payload.source_lock }}
        run: |
          test "${EXPECTED_COMMIT}" = "$(git rev-parse HEAD)"
          test "${#EXPECTED_COMMIT}" -eq 40
          test -n "${SOURCE_LOCK}"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          test "${PACKAGE_VERSION}" = "${EXPECTED_VERSION}"
          if npm view "@aximelo/cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@aximelo/cli@${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi

      - name: Check GitHub OIDC availability
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish public package with npm Trusted Publishing
        run: npm publish --access public

      - name: Read published version back from npm
        env:
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          for attempt in $(seq 1 20); do
            ACTUAL_VERSION="$(npm view "@aximelo/cli@${EXPECTED_VERSION}" version 2>/dev/null || true)"
            if test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"; then
              exit 0
            fi
            sleep 15
          done
          echo "npm registry did not return ${EXPECTED_VERSION}" >&2
          exit 1
